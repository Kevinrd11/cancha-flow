name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Evita corridas duplicadas: cancela la anterior del mismo ref si llega una nueva.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test (con cobertura y umbral)
        run: npm run test:coverage

      - name: Build
        run: npm run build
        env:
          # Valores ficticios: el build no debe requerir credenciales reales.
          # Solo habilitan la configuración pública; no se hacen llamadas de red.
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_dummy
          NEXT_PUBLIC_APP_URL: http://localhost:3000

  # Se separa del job anterior para no alargar la señal rápida de lint/tests.
  # Necesita Postgres real: las reglas de solape, la expiración de solicitudes
  # y RLS viven en la base, no en el código.
  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Levantar Supabase local
        run: npx supabase start -x studio,imgproxy,pooler

      # La clave de servicio de la base local no se guarda en el repositorio:
      # se toma de la instancia recién levantada. El nombre de la variable
      # cambió con el formato nuevo de claves, así que se aceptan los dos.
      - name: Exportar la clave de servicio local
        run: |
          eval "$(npx supabase status -o env)"
          echo "E2E_SUPABASE_SECRET_KEY=${SECRET_KEY:-$SERVICE_ROLE_KEY}" >> "$GITHUB_ENV"

      - name: Instalar navegador
        run: npx playwright install --with-deps chromium

      - name: End-to-end
        # En CI no existe el Chrome del sistema, así que se usa el Chromium
        # que trae Playwright.
        run: npx playwright test --project=chrome
        env:
          PLAYWRIGHT_CHANNEL: ""

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
