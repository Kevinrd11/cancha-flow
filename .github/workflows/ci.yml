name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Evita corridas duplicadas: cancela la anterior del mismo ref si llega una nueva.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test (con cobertura y umbral)
        run: npm run test:coverage

      - name: Build
        run: npm run build
        env:
          # Valores ficticios: el build no debe requerir credenciales reales.
          # Solo habilitan la configuración pública; no se hacen llamadas de red.
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_dummy
          NEXT_PUBLIC_APP_URL: http://localhost:3000
